[package]
name = "quick-note"
version = "0.1.0"
edition = "2024"
description = "Quick sticky-note canvas with multiple pages and Google Drive sync"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
base64 = "0.23"
webbrowser = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
aws-lc-rs = "1"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
egui_commonmark = { version = "0.25", default-features = false }
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = { version = "0.13", default-features = false, features = ["shape"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "Thang TN"
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0 | libx11-6, libegl1 | libgl1"
extended-description = "Sticky-note canvas with multiple pages, drag & resize, and Google Drive sync."
assets = [
    ["target/release/quick-note", "usr/bin/", "755"],
    ["assets/quick-note.desktop", "usr/share/applications/", "644"],
    ["assets/quick-note.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
